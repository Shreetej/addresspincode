[package]
name = "addresspincode"
version = "0.1.0"
description = "A Tauri App"
authors = ["Shreetej Ghodekar"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "addresspincode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = {version="0.31.0", features= ["bundled"] } # For history tracking
csv = "1.3"
regex = "1.10"
lazy_static = "1.5"           # minor update
strsim = "0.11"
anyhow = "1.0"
itertools = "0.13"            # minor update
tracing = "0.1"
tracing-subscriber = "0.3"
calamine = "0.32"             # updated
rayon = "1.10"                # minor update
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.14"
lru = "0.12.4"
futures = "0.3"

# Optional / remove if unused
tower-http = { version = "0.6", features = ["fs"] }  # if you use static file serving
# dashmap = "6.1"  # remove if not actually used
rust_xlsxwriter = "0.79"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
tauri-plugin-fs = "2.4.4"
